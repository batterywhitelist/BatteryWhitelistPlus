plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' 
}

android {
    namespace 'com.batterywhitelist.plus'
    compileSdk 36

    defaultConfig {
        applicationId "com.batterywhitelist.plus"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}

kotlin {
    jvmToolchain(17)
}

// 🌟 核心魔法：不管底层怎么依赖，强制用这些要求 API 35 的稳定版
configurations.all {
    resolutionStrategy {
        force 'androidx.compose.ui:ui:1.6.8'
        force 'androidx.compose.ui:ui-android:1.6.8'
        force 'androidx.compose.material3:material3:1.2.1'
        force 'androidx.compose.material3:material3-android:1.2.1'
        force 'androidx.compose.foundation:foundation:1.6.8'
        force 'androidx.compose.foundation:foundation-android:1.6.8'
        force 'androidx.compose.animation:animation:1.6.8'
        force 'androidx.compose.animation:animation-android:1.6.8'
    }
}

dependencies {
    // LSPosed
    compileOnly 'io.github.libxposed:api:102'
    compileOnly 'io.github.libxposed:service:102'

    // 🌟 关键：将 MIUIX 降级到 0.9.0，避开 API 37
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.0'
    
    // 锁定稳定的 Compose 版本
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
}