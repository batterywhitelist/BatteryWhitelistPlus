plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' 
}

android {
    namespace 'com.batterywhitelist.plus'
    compileSdk 36

    defaultConfig {
        applicationId "com.batterywhitelist.plus"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}

kotlin {
    jvmToolchain(17)
}

// 🌟 核心魔法：强行关闭检查！管你要 API 37 还是 47，直接无视！
tasks.configureEach { task ->
    if (task.name.contains("checkDebugAarMetadata") || task.name.contains("checkReleaseAarMetadata")) {
        task.enabled = false
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0@aar'
    compileOnly 'io.github.libxposed:service:102.0.0@aar'

    // 还是用 0.9.0，不回退了
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.0'
    
    implementation 'androidx.compose.ui:ui:1.6.8'
    implementation 'androidx.compose.material3:material3:1.2.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
}