plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' 
}

android {
    namespace 'com.batterywhitelist.plus'
    compileSdk 36 

    defaultConfig {
        applicationId "com.batterywhitelist.plus"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    // LSPosed
    compileOnly 'io.github.libxposed:api:102'
    compileOnly 'io.github.libxposed:service:102'

    // MIUIX
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    
    // 🌟 写死稳定的 Compose 基础版本，绝对不会去拉那些烦人的 alpha 版本了
    implementation 'androidx.compose.ui:ui:1.7.8'
    implementation 'androidx.compose.material3:material3:1.3.1'
    
    implementation 'androidx.core:core-ktx:1.15.0' // 锁定这个版本，它不会强求 36
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
}