plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' 
}

android {
    namespace 'com.batterywhitelist.plus'
    compileSdk 36

    defaultConfig {
        applicationId "com.batterywhitelist.plus"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}

// 注意：删掉了 kotlinOptions，只保留 jvmToolchain，彻底杜绝冲突
kotlin {
    jvmToolchain(17)
}

dependencies {
    // LSPosed (老老实实用带 .0.0@aar 的格式)
    compileOnly 'io.github.libxposed:api:102.0.0@aar'
    compileOnly 'io.github.libxposed:service:102.0.0@aar'

    // MIUIX 核心库 (0.9.0)
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.0'
    
    // 🌟 官方 BOM，锁定所有 Compose 组件版本，防冲突防错乱
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
}