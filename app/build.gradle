plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose' // 引入 Kotlin 2.0 官方 Compose 插件
}

android {
    namespace 'com.batterywhitelist.plus'
    compileSdk 36 // 👈 必须 36，满足 MIUIX 要求

    defaultConfig {
        applicationId "com.batterywhitelist.plus"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }
    kotlin {
    jvmToolchain(21)
}

    buildFeatures {
        compose true
    }

    // 注意：Kotlin 2.0 配合 plugin.compose 后，这里不再需要 composeOptions 了！

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
        }
    }
}

dependencies {
    // LSPosed 依赖
    compileOnly 'io.github.libxposed:api:102.0.0@aar'
    compileOnly 'io.github.libxposed:service:102.0.0@aar'

    // MIUIX 核心库
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    
    // Compose 基础组件 (交由 MIUIX 自动解析最新匹配版本)
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0'
}