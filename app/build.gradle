plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' 
}
android {
    namespace 'com.batterywhitelist.plus'
    compileSdk 36 

    defaultConfig {
        applicationId "com.batterywhitelist.plus"
        minSdk 29 // LSPosed 要求 29+
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        compose true
        //aidl true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0@aar'
    // LSPosed 102.0.0官方services
    compileOnly 'io.github.libxposed:service:102.0.0@aar'
        // ===== 1. MIUIX 依赖 =====
    // 基础 UI 组件 (必须)
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    
    // 可选组件（根据需要引入）：
    // implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    // implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4'
    
    // ===== 2. Compose 基础依赖 =====
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    // 🌟 引入 MIUIX Compose（这里用社区开源坐标，具体以你找到的库为准）
    // implementation 'com.github.Miuix:miuix-compose:0.9.4' // 示例坐标
}