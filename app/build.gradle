plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.batterywhitelist.plus'
    compileSdk 37 

    defaultConfig {
        applicationId "com.batterywhitelist.plus"
        minSdk 29 // LSPosed 通常要求 29+
        targetSdk 37
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        compose true
        aidl true
    }
    composeOptions {
        // 如果你用 Kotlin 2.0+，不需要写这个了，用 plugin.compose 即可
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0@aar'
    // LSPosed 102.0.0官方services
    compileOnly 'io.github.libxposed:service:102.0.0@aar'
    // Jetpack Compose 基础
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'

    // 🌟 引入 MIUIX Compose（这里用社区开源坐标，具体以你找到的库为准）
    implementation 'com.github.Miuix:miuix-compose:0.9.4' // 示例坐标
}